name: Release
on:
    workflow_dispatch:
      inputs:
        version:
          description: "Release version (e.g. 26.1.0)"
          required: true
          type: string
jobs:
    release:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v7
        
        - name: Install dependencies
          run: |
            sudo apt install zip
        
        - name: Create assets
          env:
            version: ${{ inputs.version }}
          run: |
            for dir in versions/*/; do
              mc_version=$(basename "$dir")
              (
                cd "$dir"
                zip -r $(git rev-parse --show-toplevel)/bin/${GITHUB_REPOSITORY#*/}-${version}+${mc_version}.zip *
              )
            done
        
        - name: Create release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            tag: ${{ inputs.version }}
          run: |
            gh release create "$tag" --repo="$GITHUB_REPOSITORY" --title="${GITHUB_REPOSITORY#*/}+${tag}" --generate-notes
        
        - name: Upload assets to GitHub
          uses: AButler/upload-release-assets@v4.0
          with:
            files: "bin/*"
            repo-token: ${{ secrets.GITHUB_TOKEN }}
            release-tag: ${{ inputs.version }}